<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same-Picture Review</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --accent: #2f6fde; --keep: #2e7d4f; --drop: #c8372d; --chip: #ecebe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #20201e; --text: #ecebe6; --muted: #9c9b95; --line: #34342f; --accent: #6b9cff; --keep: #5cc48a; --drop: #ff6b5e; --chip: #2b2b28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  #summary { color: var(--muted); margin-right: auto; }
  button, select { font: inherit; color: inherit; background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); }
  .pair { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  figure { margin: 0; border: 3px solid transparent; border-radius: 8px; padding: 4px; cursor: pointer; }
  figure.keep { border-color: var(--keep); }
  figure.drop { border-color: var(--drop); opacity: .55; }
  figure img { width: 100%; height: 220px; object-fit: contain; background: #0001; display: block; }
  figcaption { font-size: 12px; color: var(--muted); word-break: break-all; }
  figcaption b { color: var(--text); }
  .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .row button.on { background: var(--text); color: var(--panel); }
  @media (max-width: 600px) { main { grid-template-columns: 1fr; } figure img { height: 150px; } }
</style>
</head>
<body>
<header>
  <h1>Same picture, different file</h1>
  <span id="summary"></span>
  <select id="show"><option value="copy">likely copies</option><option value="shot">probably separate shots</option><option value="rot">rotated</option><option value="all">all pairs</option></select>
  <button id="acceptCopies">Keep larger for all likely copies</button>
  <button id="export" class="primary">Export decisions (CSV)</button>
</header>
<main id="list"></main>
<script src="data.js"></script>
<script>
(function () {
  const D = window.SIMILAR, key = 'similar-' + D.stamp;
  let choice = {};
  try { choice = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { choice = {}; }
  const pick = (r, i) => choice[i] || r.suggest;
  const save = () => { try { localStorage.setItem(key, JSON.stringify(choice)); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rel = p => p.slice(D.source.length + 1);
  const kb = b => b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB';

  function fig(r, side, k) {
    const p = side === 'A' ? r.a : r.b, cls = k === 'both' || k === side ? 'keep' : 'drop';
    return `<figure class="${cls}" data-side="${side}"><img loading="lazy" src="thumbs/${side === 'A' ? r.ka : r.kb}.jpg" alt="">
      <figcaption><b>${side}</b> ${esc(rel(p))}<br>${side === 'A' ? r.a_dims : r.b_dims} · ${kb(side === 'A' ? r.a_size : r.b_size)}</figcaption></figure>`;
  }
  function render() {
    const show = document.getElementById('show').value;
    let n = 0, drops = 0;
    document.getElementById('list').innerHTML = D.pairs.map((r, i) => {
      const k = pick(r, i);
      if (k !== 'both') drops++;
      if ((show === 'rot' && !r.rotation) || (show === 'copy' && r.kind !== 'copy') || (show === 'shot' && r.kind !== 'shot')) return '';
      n++;
      return `<div class="pair" data-i="${i}"><div class="pics">${fig(r, 'A', k)}${fig(r, 'B', k)}</div>
        <div class="row"><b>${r.kind === 'copy' ? 'likely copy' : 'probably a separate shot'}</b> · ${r.rotation ? 'rotated ' + r.rotation + '°' : 'same orientation'} · worst patch ${r.worst_patch}
        <span style="margin-left:auto"></span>${['A', 'B', 'both'].map(o => `<button data-k="${o}" class="${k === o ? 'on' : ''}">Keep ${o}</button>`).join('')}</div></div>`;
    }).join('');
    const copies = D.pairs.filter(r => r.kind === 'copy').length;
    document.getElementById('summary').textContent = `${D.pairs.length} pairs (${copies} likely copies) · ${drops} files to set aside · ${n} shown`;
  }
  document.getElementById('list').addEventListener('click', e => {
    const pair = e.target.closest('.pair'); if (!pair) return;
    const i = +pair.dataset.i, b = e.target.closest('button'), f = e.target.closest('figure');
    if (b) choice[i] = b.dataset.k; else if (f) choice[i] = f.dataset.side; else return;
    save(); render();
  });
  document.getElementById('show').addEventListener('change', render);
  document.getElementById('acceptCopies').addEventListener('click', () => {
    D.pairs.forEach((r, i) => { if (r.kind === 'copy') delete choice[i]; });  // back to the suggestion: keep the larger
    save(); render();
  });
  document.getElementById('export').addEventListener('click', () => {
    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const lines = ['Path,Decision,Category,Confidence,Suggestion,SizeBytes,CopyOf'];
    D.pairs.forEach((r, i) => {
      const k = pick(r, i);
      if (k === 'A') lines.push([q(r.b), 'reject', r.rotation ? 'rotated copy' : 'same-picture copy', r.pixel_diff, r.suggest === 'A' ? 'reject' : 'keep', r.b_size, q(r.a)].join(','));
      if (k === 'B') lines.push([q(r.a), 'reject', r.rotation ? 'rotated copy' : 'same-picture copy', r.pixel_diff, r.suggest === 'B' ? 'reject' : 'keep', r.a_size, q(r.b)].join(','));
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }));
    a.download = `SimilarDecisions_${D.stamp}.csv`; a.click();
  });
  render();
})();
</script>
</body>
</html>
